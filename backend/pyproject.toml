[project]
name = "pitchme"
version = "0.1.0"
description = "PitchMe backend: FastAPI service (server/) and AI analysis layer (ai/)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Krishnapriya Rajeev" }]
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
# Installed per area so working on the API does not pull in torch.
# `uv sync --all-extras` installs everything.
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "minio>=7.2",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "email-validator>=2.2",
    "python-multipart>=0.0.12",
]
# Hosted LLM and transcription clients (Groq, Gemini).
llm = [
    "groq>=0.13",
    "google-genai>=1.0",
]
# Signal analysis for the voice pipeline: pitch, jitter, shimmer and HNR
# through Praat.
voice = [
    "numpy>=1.26",
    "praat-parselmouth>=0.4.5",
]
# Body and face landmarks for the vision pipeline. mediapipe brings its
# own OpenCV build. The model files are downloaded separately with
# scripts/download_models.sh.
vision = [
    "numpy>=1.26",
    "mediapipe>=0.10.20",
]
# Reading playbooks for the content judge: PDF, PowerPoint and Word.
content = [
    "pypdf>=5.0",
    "python-pptx>=1.0",
    "python-docx>=1.1",
]
# Speaker diarization and voice matching with pyannote. Pulls in torch (a
# large download); only needed for recordings with two voices on one track.
diarize = [
    "pyannote.audio>=3.3",
]
# Offline transcription with faster-whisper. Large download; only needed
# when TRANSCRIBE_PROVIDER=local.
whisper-local = [
    "faster-whisper>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Two top-level packages: `ai` (analysis) and `server` (HTTP API).
[tool.hatch.build.targets.wheel]
packages = ["ai", "server"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",  # the formatter owns line length
    "B008",  # FastAPI's Depends() in argument defaults is intended
]

[tool.ruff.lint.isort]
# The local alembic/ migrations folder is not the alembic package.
known-third-party = ["alembic"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not live' --cov=ai --cov=server --cov-report=term-missing"
asyncio_mode = "auto"
markers = [
    "integration: needs running services (Postgres, MinIO, LiveKit)",
    "live: calls a hosted provider and spends quota; run with make test-live",
]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
