[project]
name = "pitchme"
version = "0.1.0"
description = "PitchMe backend: FastAPI service (server/) and AI analysis layer (ai/)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Krishnapriya Rajeev" }]
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
# Installed per area so working on the API does not pull in torch.
# `uv sync --all-extras` installs everything.
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Two top-level packages: `ai` (analysis) and `server` (HTTP API).
[tool.hatch.build.targets.wheel]
packages = ["ai", "server"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",  # the formatter owns line length
    "B008",  # FastAPI's Depends() in argument defaults is intended
]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=ai --cov=server --cov-report=term-missing"
asyncio_mode = "auto"
markers = [
    "integration: needs running services (Postgres, MinIO, LiveKit) or real provider keys",
]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
